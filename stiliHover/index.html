<div className="flex flex-col items-center space-y-4 p-6">
  <h1 className="text-3xl font-bold mb-6">Pulsanti con Hover</h1>

  <!-- Pulsante 1: Cambia colore di sfondo -->
  <button className="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition">
    Hover: Sfondo Blu
  </button>

  <!-- Pulsante 2: Cambia colore testo -->
  <button className="bg-white text-red-500 border border-red-500 px-6 py-2 rounded hover:text-white hover:bg-red-500 transition">
    Hover: Testo Rosso
  </button>

  <!-- Pulsante 3: Aumenta dimensione -->
  <button className="bg-green-500 text-white px-6 py-2 rounded transform hover:scale-105 transition-transform">
    Hover: Scala +
  </button>

  <!-- Pulsante 4: Cambia bordo -->
  <button className="bg-transparent text-purple-500 border border-purple-500 px-6 py-2 rounded hover:border-4 transition">
    Hover: Bordo Spesso
  </button>

  <!-- Pulsante 5: Ombra -->
  <button className="bg-yellow-500 text-white px-6 py-2 rounded shadow hover:shadow-2xl transition-shadow">
    Hover: Ombra
  </button>

  <!-- Pulsante 6: Ruota -->
  <button className="bg-pink-500 text-white px-6 py-2 rounded transform hover:rotate-12 transition-transform">
    Hover: Ruota
  </button>
</div>
