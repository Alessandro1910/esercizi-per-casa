<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Flex Wrap con Tailwind CSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <!-- Contenitore Flex con wrap -->
  <div class="flex flex-wrap gap-4">

    <!-- Elementi -->
    <div class="bg-blue-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 1
    </div>

    <div class="bg-green-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 2
    </div>

    <div class="bg-red-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 3
    </div>

    <div class="bg-yellow-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 4
    </div>

    <div class="bg-purple-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 5
    </div>

    <div class="bg-indigo-500 text-white p-6 rounded-lg shadow-md flex-1 min-w-[200px] text-center">
      Elemento 6
    </div>

  </div>

</body>
</html>
