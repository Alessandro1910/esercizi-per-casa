<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen">

  <!-- Contenitore Flex centrato -->
  <div class="flex justify-center items-center h-full">

    <!-- Card centrata -->
    <div class="bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-center">Card Centrata</h2>
      <p class="text-gray-600 mb-6 text-center">
        Questa card è centrata sia orizzontalmente che verticalmente usando Tailwind CSS.
      </p>
      <div class="flex justify-center">
        <button class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
          Conferma

      </div>
    </div>

  </div>
